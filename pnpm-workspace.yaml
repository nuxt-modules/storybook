packages:
  - docs
  - playground
  - examples/**
  - packages/**

catalog:
  '@chromatic-com/storybook': ^5.6.0
  '@nuxt/image': 2.0.0
  '@nuxtjs/i18n': 10.4.0
  '@storybook/addon-docs': ^11.0.0-beta.3
  '@storybook/addon-links': ^11.0.0-beta.3
  '@storybook/builder-vite': ^11.0.0-beta.3
  '@storybook/react-vite': ^11.0.0-beta.3
  '@storybook/vue3': ^11.0.0-beta.3
  '@storybook/vue3-vite': ^11.0.0-beta.3
  changelogen: 0.6.2
  nuxt: 4.4.8
  storybook: ^11.0.0-beta.3
  typescript: 6.0.3
  unbuild: 3.6.1
  vue: 3.5.38
  vue-router: 5.1.0

overrides:
  '@nuxtjs/storybook': workspace:*
  '@storybook-vue/nuxt': workspace:*

linkWorkspacePackages: deep

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  better-sqlite3: true
  sharp: true

peerDependencyRules:
  ignoreMissing:
    - vue
    - webpack

minimumReleaseAgeExclude:
  - '@storybook/addon-docs@11.0.0-beta.3'
  - '@storybook/addon-links@11.0.0-beta.3'
  - '@storybook/builder-vite@11.0.0-beta.3'
  - '@storybook/react-vite@11.0.0-beta.3'
  - '@storybook/react@11.0.0-beta.3'
  - '@storybook/vue3-vite@11.0.0-beta.3'
  - '@storybook/vue3@11.0.0-beta.3'
  - storybook@11.0.0-beta.3
  - '@storybook/vite-plugin@0.2.0'
