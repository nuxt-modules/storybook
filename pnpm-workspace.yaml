packages:
  - docs
  - playground
  - examples/**
  - packages/**

catalog:
  '@chromatic-com/storybook': ^5.3.1
  '@nuxt/image': 2.1.0
  '@nuxtjs/i18n': 10.6.0
  '@storybook/addon-docs': ^10.6.0
  '@storybook/addon-links': ^10.6.0
  '@storybook/builder-vite': ^10.6.0
  '@storybook/react-vite': ^10.6.0
  '@storybook/vue3': ^10.6.0
  '@storybook/vue3-vite': ^10.6.0
  changelogen: 0.6.2
  nuxt: 4.5.2
  storybook: ^10.6.0
  typescript: 6.0.3
  unbuild: 3.6.1
  vue: 3.5.42
  vue-router: 5.3.1

overrides:
  h3: 1.15.11
  h3-next: npm:h3@1.15.11
  '@nuxtjs/storybook': workspace:*

linkWorkspacePackages: deep

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  better-sqlite3: true
  sharp: true

peerDependencyRules:
  ignoreMissing:
    - vue
    - webpack
