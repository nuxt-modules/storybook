packages:
  - docs
  - playground
  - examples/**
  - packages/**

catalog:
  '@chromatic-com/storybook': ^5.1.2
  '@nuxt/image': 2.0.0
  '@nuxtjs/i18n': 10.4.0
  '@storybook/addon-docs': ^10.3.6
  '@storybook/addon-links': ^10.3.6
  '@storybook/builder-vite': ^10.3.6
  '@storybook/react-vite': ^10.3.6
  '@storybook/vue3': ^10.3.6
  '@storybook/vue3-vite': ^10.3.6
  changelogen: 0.6.2
  nuxt: 4.4.8
  storybook: ^10.3.6
  typescript: 6.0.3
  unbuild: 3.6.1
  vue: 3.5.38
  vue-router: 5.1.0

overrides:
  h3: 1.15.11
  h3-next: npm:h3@1.15.11
  '@nuxtjs/storybook': workspace:*

linkWorkspacePackages: deep

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  better-sqlite3: true
  sharp: true

peerDependencyRules:
  ignoreMissing:
    - vue
    - webpack
