packages:
  - docs
  - playground
  - examples/**
  - packages/**

catalog:
  '@chromatic-com/storybook': ^5.6.0
  '@nuxt/image': 2.0.0
  '@nuxtjs/i18n': 10.4.0
  '@storybook/addon-docs': ^11.0.0-beta.3
  '@storybook/addon-links': ^11.0.0-beta.3
  '@storybook/builder-vite': ^11.0.0-beta.3
  '@storybook/react-vite': ^11.0.0-beta.3
  '@storybook/vue3': ^11.0.0-beta.3
  '@storybook/vue3-vite': ^11.0.0-beta.3
  changelogen: 0.6.2
  nuxt: 4.4.8
  storybook: ^11.0.0-beta.3
  typescript: 7.0.2
  unbuild: 3.6.1
  vue: 3.5.38
  vue-router: 5.1.0

catalogs:
  docs:
    '@iconify-json/lucide': 1.2.154
    '@iconify-json/simple-icons': 1.2.102
    '@iconify-json/vscode-icons': 1.2.98
    '@nuxt/content': 3.16.2
    '@nuxt/devtools': 4.1.0
    '@nuxt/fonts': 1.2.0
    '@nuxt/ui': 4.12.0
    '@nuxtjs/mcp-toolkit': 0.24.3
    '@nuxtjs/mdc': 0.23.3
    '@takumi-rs/core': 2.20.0
    '@vueuse/core': 15.0.0
    better-sqlite3: 13.2.0
    h3: 2.0.8
    minimark: 0.2.0
    nuxt: npm:nuxt-nightly@5.0.0-2611132210-2c5d147
    nuxt-content-twoslash: 0.4.0
    nuxt-llms: 0.3.2
    nuxt-og-image: 7.0.7
    picomatch: 4.0.7
    remark-emoji: 5.0.2
    shiki: 4.6.0
    tailwindcss: 4.3.5
    twoslash: 0.3.9
    ufo: 1.6.4
    unist-util-visit: 5.2.0
    vue: 3.5.45
    vue-router: 5.5.0
    vue-tsc: 3.3.14
    zod: 4.6.7

overrides:
  '@nuxtjs/storybook': workspace:*
  '@storybook-vue/nuxt': workspace:*

linkWorkspacePackages: deep

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
  better-sqlite3: true
  sharp: true

peerDependencyRules:
  ignoreMissing:
    - vue
    - webpack

minimumReleaseAgeExclude:
  - '@storybook/addon-docs@11.0.0-beta.3'
  - '@storybook/addon-links@11.0.0-beta.3'
  - '@storybook/builder-vite@11.0.0-beta.3'
  - '@storybook/react-vite@11.0.0-beta.3'
  - '@storybook/react@11.0.0-beta.3'
  - '@storybook/vue3-vite@11.0.0-beta.3'
  - '@storybook/vue3@11.0.0-beta.3'
  - storybook@11.0.0-beta.3
  - '@storybook/vite-plugin@0.2.0'
