name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

jobs:
  preview:
    name: Preview release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'nuxt-modules' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Prepare build environment
        run: pnpm dev:prepare

      - name: Build
        run: pnpm build

      - name: 📦 Release pkg.pr.new
        run: pnpm pkg-pr-new publish --compact --pnpm './packages/*'

  detect:
    name: Detect release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository_owner == 'nuxt-modules' }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for an untagged version
        id: version
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ "$TAG" != "v" ] && [ -z "$REMOTE_TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: detect
    concurrency:
      group: release
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.tag != '' }}
    timeout-minutes: 20
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Publish packages
        run: pnpm publish --recursive --access public --no-git-checks --provenance --tag latest

      - name: Create tag
        run: git tag "$TAG" && git push origin "$TAG"

      - name: Create GitHub Release
        run: pnpm changelogen gh release "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
